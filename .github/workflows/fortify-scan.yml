
name: Fortify on Demand Scan

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  fortify-scan:
    name: WebGoat Fortify SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fortify on Demand SAST Scan
        uses: fortify/github-action@v3
        env:
          # FoD connection
          FOD_URL: ${{ vars.FOD_URL }}
          FOD_TENANT: ${{ secrets.FOD_TENANT }}
          FOD_USER: ${{ secrets.FOD_USER }}
          FOD_PASSWORD: ${{ secrets.FOD_PAT }}

          # Application and release
          FOD_RELEASE: webgoat:master

          # Automatically create application/release if missing
          DO_SETUP: 'true'

          # Configure Static Assessment
          SAST_ASSESSMENT_TYPE: Static Assessment

          # Maven packaging
          PACKAGE_EXTRA_OPTS: "-bt mvn"

          # Run SAST
          DO_SAST_SCAN: 'true'
          DO_WAIT: 'true'

          # Export results to GitHub Security
          DO_SAST_EXPORT: 'true'

          # Pin fcli version
          FCLI_BOOTSTRAP_VERSION: v3.29.0
